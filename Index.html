

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex World</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-weight: 600; background: #0f1520; color: #cfd6e2; padding-bottom: 96px; line-height: 1.9; min-height: 100vh; }
  header { padding: 20px 26px; background: #0a0f18; border-bottom: 1px solid #243044; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 26px; height: 26px; }
  .logo i { display: block; }
  .logo i:nth-child(1) { background: #d4a64a; } .logo i:nth-child(2) { background: #5b7aa8; } .logo i:nth-child(3) { background: #3f5a85; } .logo i:nth-child(4) { background: #2a3f63; }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; color: #eef1f6; letter-spacing: 2px; text-transform: uppercase; }
  header select { background: #172033; color: #cfd6e2; border: 1px solid #2f3d56; border-radius: 6px; padding: 10px 14px; font-size: 13px; font-weight: 700; }
  .screen { display: none; padding: 48px 26px; max-width: 780px; margin: 0 auto; }
  .screen.active { display: block; animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  h2 { margin: 0 0 14px 0; font-size: 32px; font-weight: 800; color: #eef1f6; letter-spacing: 0.5px; }
  .sub { color: #8a97ad; font-size: 15px; margin: 0 0 44px 0; font-weight: 600; }
  .card { background: #172033; border: 1px solid #243044; border-radius: 12px; padding: 38px; margin-bottom: 40px; }
  .card h3 { margin: 0 0 28px 0; font-size: 13px; letter-spacing: 3px; color: #d4a64a; text-transform: uppercase; font-weight: 800; }
